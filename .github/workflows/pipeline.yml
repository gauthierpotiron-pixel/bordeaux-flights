# Collecte les départs de BOD, prédit les retards et publie data/predictions.json.
# - Toutes les heures de 05:15 à 22:15 (heure d'été ; une heure plus tôt en hiver) :
#   tableau des départs de l'aéroport, sans quota.
# - Une fois par soir : AviationStack pour les heures réelles de départ
#   (3 pages maximum, soit 93 appels par mois au plus ; quota gratuit : 100).
# Si tu ajoutes un passage AviationStack, mets à jour AVIATIONSTACK_RUNS_PER_DAY
# dans scripts/pipeline.py.
name: Pipeline BOD

on:
  schedule:
    - cron: "15 3-20 * * *"   # aéroport, toutes les heures
    - cron: "45 21 * * *"     # AviationStack, 23:45 l'été (22:45 l'hiver)
  workflow_dispatch:
    inputs:
      source:
        description: "Source à lire"
        type: choice
        options:
          - airport
          - aviationstack
          - aucune (recalcul seul)
        default: airport

permissions:
  contents: write
  pages: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collecte et prédiction
        env:
          AVIATIONSTACK_KEY: ${{ secrets.AVIATIONSTACK_KEY }}
          SCHEDULE: ${{ github.event.schedule }}
          SOURCE: ${{ inputs.source }}
        run: |
          if [ "$SCHEDULE" = "45 21 * * *" ] || [ "$SOURCE" = "aviationstack" ]; then
            python scripts/pipeline.py --source aviationstack
          elif [ -n "$SOURCE" ] && [ "$SOURCE" != "airport" ]; then
            python scripts/pipeline.py --no-collect
          else
            python scripts/pipeline.py --source airport
          fi

      # Toujours enregistrer, même en cas d'erreur, pour ne pas perdre le compteur d'appels.
      - name: Enregistrer les données
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi
          git commit -m "Données du $(TZ=Europe/Paris date +'%Y-%m-%d %H:%M')"
          git pull --rebase
          git push

      # Les commits faits par le workflow ne relancent pas GitHub Pages tout seuls.
      - name: Republier le site
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Republication non demandée."
